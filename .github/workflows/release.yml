name: Release artifact diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: 40139327833
          name: macos-candidate-${{ matrix.arch }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Verify bundle without FinderInfo layout metadata
        shell: bash
        run: |
          set -euo pipefail
          mount="$RUNNER_TEMP/Peach-diagnostic"
          mkdir -p "$mount"
          hdiutil attach release/Peach-0.47.0-macos-${{ matrix.arch }}.dmg -shadow "$RUNNER_TEMP/peach-diagnostic.shadow" -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          xattr -p com.apple.FinderInfo "$mount/Peach.app"
          xattr -d com.apple.FinderInfo "$mount/Peach.app"
          codesign --verify --deep --strict --verbose=4 "$mount/Peach.app"
          lipo "$mount/Peach.app/Contents/MacOS/Peach" -verify_arch '${{ matrix.arch }}'
          python scripts/smoke_macos.py "$mount/Peach.app"
