name: Release artifact diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: 40138413229
          name: macos-candidate-arm64
      - name: Inspect downloaded bundle seal
        shell: bash
        run: |
          set -euo pipefail
          mount="$RUNNER_TEMP/Peach-diagnostic"
          mkdir -p "$mount"
          hdiutil attach release/Peach-0.47.0-macos-arm64.dmg -readonly -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          codesign --verify --deep --strict --verbose=4 "$mount/Peach.app"
